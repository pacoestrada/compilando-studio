name: Build and test Windows EXE
on:
  push:
    branches: [main]
    paths:
      - 'packaging/*windows*'
      - 'packaging/*Windows*'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned build dependencies
        run: python -m pip install -r packaging/requirements-windows.txt
      - name: Build and test the actual EXE
        run: python packaging/build_windows.py
      - name: Keep test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-failure-report
          path: dist/windows/Windows-self-test.*
          if-no-files-found: ignore
      - name: Upload validated Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: Compilando-Studio-Windows-x64
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 7
